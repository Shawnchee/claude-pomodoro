name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac-native:
    name: Build macOS (SwiftUI native)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build SwiftUI app (release, arm64)
        working-directory: mac-native
        run: swift build -c release --arch arm64

      - name: Assemble .app bundle
        working-directory: mac-native
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          APP_NAME="Claude Pomodoro"
          BUNDLE_ID="com.shawnchee.claudepomodoro"
          BUILD_DIR=".build/arm64-apple-macosx/release"
          APP_DIR="build/${APP_NAME}.app"
          CONTENTS="$APP_DIR/Contents"
          MACOS_DIR="$CONTENTS/MacOS"
          RES_DIR="$CONTENTS/Resources"

          rm -rf build
          mkdir -p "$MACOS_DIR" "$RES_DIR"

          # Copy the executable
          cp "$BUILD_DIR/ClaudePomodoro" "$MACOS_DIR/ClaudePomodoro"
          chmod +x "$MACOS_DIR/ClaudePomodoro"

          # Copy the SPM-generated resource bundle to Contents/Resources/
          # (the standard macOS location). The app source overrides
          # Bundle.module via AnimatedGIFView.resourceBundle to look here
          # first, then fall back to the .app root for SPM compatibility.
          # Putting it under Contents/ also lets codesign --deep seal the
          # whole bundle cleanly.
          if ls "$BUILD_DIR"/*.bundle >/dev/null 2>&1; then
            cp -R "$BUILD_DIR"/*.bundle "$RES_DIR/"
          else
            echo "WARNING: no SPM resource bundle found in $BUILD_DIR" >&2
            exit 1
          fi

          # Generate AppIcon.icns from build/icon.png (1024x1024).
          # macOS Finder/Launchpad/Dock look up the icon via the
          # CFBundleIconFile key in Info.plist (added below) which points to
          # this file in Contents/Resources/. Without this, the .app shows
          # the generic blank document icon everywhere.
          ICONSET="build/AppIcon.iconset"
          ICON_SRC="../build/icon.png"
          mkdir -p "$ICONSET"
          sips -z 16 16     "$ICON_SRC" --out "$ICONSET/icon_16x16.png"      > /dev/null
          sips -z 32 32     "$ICON_SRC" --out "$ICONSET/icon_16x16@2x.png"   > /dev/null
          sips -z 32 32     "$ICON_SRC" --out "$ICONSET/icon_32x32.png"      > /dev/null
          sips -z 64 64     "$ICON_SRC" --out "$ICONSET/icon_32x32@2x.png"   > /dev/null
          sips -z 128 128   "$ICON_SRC" --out "$ICONSET/icon_128x128.png"    > /dev/null
          sips -z 256 256   "$ICON_SRC" --out "$ICONSET/icon_128x128@2x.png" > /dev/null
          sips -z 256 256   "$ICON_SRC" --out "$ICONSET/icon_256x256.png"    > /dev/null
          sips -z 512 512   "$ICON_SRC" --out "$ICONSET/icon_256x256@2x.png" > /dev/null
          sips -z 512 512   "$ICON_SRC" --out "$ICONSET/icon_512x512.png"    > /dev/null
          cp "$ICON_SRC" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$RES_DIR/AppIcon.icns"
          rm -rf "$ICONSET"

          # Write Info.plist
          cat > "$CONTENTS/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>ClaudePomodoro</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>${BUNDLE_ID}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key>
            <string>${APP_NAME}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.productivity</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSUserNotificationsUsageDescription</key>
            <string>Claude Pomodoro sends notifications when a work or break session ends.</string>
          </dict>
          </plist>
          PLIST

          # Ad-hoc seal the whole bundle. Works now because all content is
          # under Contents/ (resource bundle is in Contents/Resources/).
          codesign -s - --deep --force --timestamp=none "$APP_DIR"

          # Sanity check
          codesign --verify --verbose "$APP_DIR" || true
          ls -la "$APP_DIR/Contents"

      - name: Create DMG
        working-directory: mac-native
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          hdiutil create \
            -volname "Claude Pomodoro" \
            -srcfolder "build/Claude Pomodoro.app" \
            -ov \
            -format UDZO \
            "dist/Claude-Pomodoro-${VERSION}-arm64.dmg"
          ls -la dist

      - name: Upload macOS DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mac-native/dist/*.dmg
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build-electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
